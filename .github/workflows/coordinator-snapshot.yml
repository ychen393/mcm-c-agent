name: Coordinator snapshot (read-only)

# GitHub event-driven snapshot; does not launch Cursor or modify repository.
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main, "feature/**", "cursor/**", "test/**"]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: coordinator-snapshot-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Generate current GitHub task snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m tools.coordinator_snapshot --repo "$GITHUB_REPOSITORY" --out coordinator-view
      - uses: actions/upload-artifact@v4
        with:
          name: coordinator-view
          path: coordinator-view/
          retention-days: 7
